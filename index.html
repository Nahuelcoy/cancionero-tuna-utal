  --bg:#f6f4f5; --surface:#ffffff; --ink:#1d1619; --muted:#6c5f65; --line:#e3dade;
  --wine:#7a1f2e; --wine-soft:#f3e3e6; --gold:#9a6b12; --gold-soft:#f6ecd6;
  --chord:#a3182c; --ok:#2f6b3a; --warn:#94600a;
  --f-display:"Alegreya SC", Georgia, serif; --f-body:"Alegreya Sans", system-ui, sans-serif;
  --f-sheet:"Tinos","Times New Roman",Times,serif; --f-mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141012; --surface:#1d181b; --ink:#f1e9ec; --muted:#a8999f; --line:#33292e;
  --wine:#e0808f; --wine-soft:#3a1f26; --gold:#e3b75c; --gold-soft:#33291a; --chord:#ff8a99; --ok:#7fc58b; --warn:#e8b25a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141012; --surface:#1d181b; --ink:#f1e9ec; --muted:#a8999f; --line:#33292e;
  --wine:#e0808f; --wine-soft:#3a1f26; --gold:#e3b75c; --gold-soft:#33291a; --chord:#ff8a99; --ok:#7fc58b; --warn:#e8b25a; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--wine)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .in{display:flex;align-items:center;gap:12px;padding-block:10px;max-width:1200px;margin:0 auto}
.brand{display:flex;flex-direction:column;line-height:1.05;text-decoration:none;color:var(--ink);min-width:0}
.brand b{font-family:var(--f-display);font-size:1.35rem;letter-spacing:.02em;color:var(--wine)}
.brand span{font-size:.78rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.crest{height:46px;width:auto;flex:none}
.hero{display:flex;align-items:center;gap:18px;margin-bottom:16px}
.hero img{width:96px;height:auto;flex:none}
.hero h1{font-family:var(--f-display);font-size:clamp(1.5rem,4vw,2.2rem);margin:0;line-height:1.1;color:var(--wine)}
.hero p{margin:4px 0 0;color:var(--muted)}
.sheetbox{position:relative}
.sheetbox::after{content:"";position:absolute;right:16px;top:16px;width:160px;height:160px;background:var(--crest) center/contain no-repeat;opacity:.07;pointer-events:none}
.status{margin-left:auto;font-size:.8rem;color:var(--muted);text-align:right}
main{max-width:1200px;margin:0 auto;padding-block:16px 48px}
/* list */
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.search{flex:1 1 240px;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);padding:5px 10px;border-radius:999px;cursor:pointer;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--wine);border-color:var(--wine);color:var(--surface)}
.count{color:var(--muted);font-size:.85rem;margin:4px 0 10px}
.songs{list-style:none;margin:0;padding:0;columns:3 280px;column-gap:24px}
.songs li{break-inside:avoid}
.songs a{display:flex;align-items:baseline;gap:8px;padding:8px 2px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.songs a:hover .t{color:var(--wine)}
.songs .t{font-weight:500;flex:1;min-width:0}
.songs .g{font-size:.76rem;color:var(--muted);white-space:nowrap}
.letter{font-family:var(--f-display);color:var(--gold);font-size:1.2rem;padding-top:10px;break-after:avoid}
.dot{width:7px;height:7px;border-radius:50%;background:var(--gold);flex:none;align-self:center}
/* song */
.back{display:inline-flex;gap:6px;align-items:center;text-decoration:none;font-size:.9rem;margin-bottom:6px}
h1.song{font-family:var(--f-display);font-size:clamp(1.6rem,4.5vw,2.4rem);line-height:1.1;margin:0;color:var(--ink);text-wrap:balance}
.sub{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 14px;color:var(--muted);font-size:.9rem}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;background:var(--gold-soft);color:var(--gold);font-size:.8rem;font-weight:500}
.pill.wine{background:var(--wine-soft);color:var(--wine)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.tabs button[aria-selected="true"]{color:var(--wine);border-bottom-color:var(--wine)}
.panel{padding-top:14px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.grp{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.grp > *{border:0;background:none;padding:6px 10px}
.grp button{cursor:pointer}
.grp button:hover{background:var(--wine-soft)}
.grp .lbl{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding-right:4px}
.grp .val{min-width:3.2em;text-align:center;font-variant-numeric:tabular-nums;font-weight:700}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:10px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--wine)}
.btn.primary{background:var(--wine);border-color:var(--wine);color:var(--surface)}
.btn.small{padding:4px 9px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:default}
.sheetbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
.sheet{font-family:var(--f-sheet);white-space:pre;tab-size:2.95em;padding:16px 18px;margin:0;line-height:1.28;min-width:max-content}
.sheet .c{color:var(--chord);font-weight:700}
.sheet .c b{font-weight:700}
.sheet .s{color:var(--gold);font-weight:700;font-style:italic}
.sheet .l{display:block}
.sheet .bl{display:block;height:.7em}
.sheet .ln{display:block}
.note{font-size:.88rem;color:var(--muted)}
.notice{border:1px solid var(--line);background:var(--gold-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:.9rem;margin-bottom:12px}
.edit textarea{width:100%;min-height:60vh;font-family:var(--f-sheet);white-space:pre;overflow-wrap:normal;overflow-x:auto;tab-size:2.95em;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);line-height:1.28}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.field input,.field select,.field textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-block:12px}
.list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.item .main{flex:1 1 220px;min-width:0}
.item .meta{font-size:.82rem;color:var(--muted)}
.item audio{width:100%;margin-top:6px}
.empty{color:var(--muted);font-size:.92rem;padding:14px;border:1px dashed var(--line);border-radius:12px}
h2.sec{font-family:var(--f-display);font-size:1.25rem;margin:18px 0 8px;color:var(--wine)}
/* player */
.prog{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0}
.prog button{font-family:var(--f-sheet);font-weight:700;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 7px;cursor:pointer;color:var(--chord);min-width:2.6em}
.prog button.on{background:var(--chord);color:var(--surface);border-color:var(--chord)}
.inst{display:flex;flex-wrap:wrap;gap:6px}
.inst label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:5px 11px;background:var(--surface);cursor:pointer;font-size:.92rem}
.inst input{accent-color:var(--wine)}
.beat{display:flex;gap:5px;margin:8px 0}
.beat i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.beat i.on{background:var(--gold)}
/* tabs editor */
.tabtext{font-family:var(--f-mono);font-size:13px;white-space:pre;line-height:1.35;margin:0;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
.tabedit{width:100%;min-height:340px;font-family:var(--f-mono);font-size:13px;white-space:pre;overflow-wrap:normal;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);line-height:1.35}
.shapes{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}
.shape{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 8px 4px;text-align:center}
.shape svg{display:block}
.shape b{font-family:var(--f-sheet);color:var(--chord)}
.hist{font-size:.88rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:.92rem;z-index:20;max-width:calc(100% - 32px)}
.row2{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:900px){.row2.split{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}}
/* celular */
.tabs .ic{display:none}
.btn,.grp button,.chip{min-height:40px}
.scrollbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (max-width:700px){
  body{font-size:17px}
  .brand span,.status{display:none}
  .crest{height:38px}
  header.top .in{padding-block:6px}
  main{padding-block:10px calc(84px + env(safe-area-inset-bottom,0px))}
  .hero img{width:64px}
  .songs{columns:1}
  .songs a{padding:13px 2px}
  .tools{position:sticky;top:calc(env(safe-area-inset-top,0px) + 51px);z-index:4;background:var(--bg);padding-block:8px;margin:0}
  .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
  .chip{white-space:nowrap}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);border-bottom:0;
    padding:4px max(6px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));gap:0;overflow:visible}
  .tabs button{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:.72rem;border-bottom:0;border-top:2px solid transparent;min-width:0}
  .tabs button[aria-selected="true"]{border-top-color:var(--wine);border-bottom:0}
  .tabs .ic{display:block;width:22px;height:22px}
  .tabs .full{display:none}
  .sub .last{display:none}
  .sheet{padding:12px 12px}
  .bar{gap:6px}
  .form{grid-template-columns:minmax(0,1fr)!important}
  .songnav{display:flex}
}
.tabs .short{display:none}
@media (max-width:700px){.tabs .short{display:inline}}
.songnav{display:none;justify-content:space-between;gap:8px;margin-top:14px}
.songnav a{flex:1;text-align:center;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-decoration:none;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
"use strict";
const SONGS = JSON.parse(document.getElementById('songs-data').textContent);
const BYID = Object.fromEntries(SONGS.map(s=>[s.id,s]));
const $ = (s,r=document)=>r.querySelector(s);
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600)}
function fmtDate(ms){if(!ms)return'';const d=new Date(ms);return d.toLocaleDateString('es-CL',{day:'numeric',month:'short',year:'numeric'})+' '+d.toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'})}

/* ---------- music theory ---------- */
const SHARP=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLAT=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const LAT={do:0,re:2,mi:4,fa:5,sol:7,la:9,si:11};
const LATN=['Do','Do#','Re','Re#','Mi','Fa','Fa#','Sol','Sol#','La','La#','Si'];
const ROOT_RE=/^(Do|Re|Mi|Fa|Sol|La|Si|[A-G])(#|b|♯|♭)?/;
const CHORD_RE=/^(?:Do|Re|Mi|Fa|Sol|La|Si|[A-G])(?:#|b|♯|♭)?(?:maj7|maj9|maj|min|m|M|dim7|dim|aug|sus2|sus4|sus|add9|add|°|\+)?(?:\d{1,2})?(?:\+5|-5|b5|#5|\+)?(?:\([^)]*\))?(?:\/(?:[A-G](?:#|b)?))?\*?$/;
const JUNK_RE=/^(x\d+|\(?bis\)?|\(x?\d+\)|x|\.+|…|:|\(|\)|-|–|—|\|)$/i;
function isChordTok(t){return CHORD_RE.test(t.replace(/^[(*]+|[).,*:]+$/g,''))}
function lineKind(line){
  const st=line.trim(); if(!st) return 'b';
  let body=st.replace(/^(intro|intermedio|interludio|final|coro|puente|instrumental)\s*[:.…]*\s*/i,'');
  const toks=body.split(/[\s\-–—,|]+/).filter(Boolean).filter(t=>!JUNK_RE.test(t));
  if(toks.length){const c=toks.filter(isChordTok).length; if(c/toks.length>=0.75) return 'c';}
  if(/^(intro|coro|interludio|intermedio|final|puente|estribillo|instrumental|repite|tab)\b/i.test(st) || (st===st.toUpperCase() && /[A-ZÁÉÍÓÚÑ]/.test(st) && st.length<26)) return 's';
  return 'l';
}
function parseChord(tok){
  const t=tok.replace(/^[(*]+|[).,*:]+$/g,''); const m=t.match(ROOT_RE); if(!m) return null;
  let r=m[1], acc=m[2]||''; let pc = LAT[r.toLowerCase()]!==undefined && r.length>1 ? LAT[r.toLowerCase()] : SHARP.indexOf(r);
  if(acc==='#'||acc==='♯') pc++; if(acc==='b'||acc==='♭') pc--; pc=(pc+12)%12;
  let rest=t.slice(m[0].length); let bass=null;
  const sl=rest.match(/\/([A-G](?:#|b)?)$/); if(sl){bass=SHARP.indexOf(sl[1][0])+(sl[1][1]==='#'?1:sl[1][1]==='b'?-1:0);bass=(bass+12)%12;rest=rest.slice(0,-sl[0].length)}
  const q=rest.replace(/[()]/g,'');
  let iv=[0,4,7];
  const minor=/^(m(?!aj)|min)/.test(q);
  if(minor) iv=[0,3,7];
  if(/dim|°/.test(q)) iv=[0,3,6];
  if(/aug|^\+|\+5|#5/.test(q)) iv=[0,4,8];
  if(/sus4|sus$/.test(q)) iv=[0,5,7];
  if(/sus2/.test(q)) iv=[0,2,7];
  if(/-5|b5/.test(q)) iv=iv.map(x=>x===7?6:x);
  if(/maj7|M7|7M/.test(q)) iv.push(11);
  else if(/dim7/.test(q)) iv.push(9);
  else if(/7|9|11|13/.test(q)) iv.push(10);
  if(/6/.test(q)&&!/maj|7/.test(q)) iv.push(9);
  if(/9/.test(q)) iv.push(14);
  return {root:pc,iv,bass:bass??pc,name:t,latin:!!(LAT[r.toLowerCase()]!==undefined&&r.length>1),flat:acc==='b'||acc==='♭'};
}
function transposeTok(tok,n){
  if(!n) return tok;
  return tok.replace(/(^[(*]*)(Do|Re|Mi|Fa|Sol|La|Si|[A-G])(#|b|♯|♭)?/,(all,pre,r,acc)=>{
    const latin=LAT[r.toLowerCase()]!==undefined&&r.length>1; let pc=latin?LAT[r.toLowerCase()]:SHARP.indexOf(r);
    if(acc==='#'||acc==='♯')pc++; if(acc==='b'||acc==='♭')pc--; pc=((pc+n)%12+24)%12;
    return pre+(latin?LATN[pc]:(acc==='b'||acc==='♭'?FLAT[pc]:SHARP[pc]));
  }).replace(/\/([A-G])(#|b)?/,(all,r,acc)=>{let pc=SHARP.indexOf(r)+(acc==='#'?1:acc==='b'?-1:0);pc=((pc+n)%12+24)%12;return '/'+(acc==='b'?FLAT[pc]:SHARP[pc])});
}
/* transpose a chord line keeping columns */
function transposeLine(line,n){
  if(!n) return line;
  let out='',debt=0;
  const parts=line.split(/(\s+)/);
  for(const p of parts){
    if(!p) continue;
    if(/^\s+$/.test(p)){
      if(p.includes('\t')){out+=p;debt=0;continue}
      let len=p.length-debt; if(len<1){debt=1-len;len=1}else debt=0; out+=' '.repeat(len);continue}
    const sub=p.split(/([\-–—,|])/).map(x=>isChordTok(x)?transposeTok(x,n):x).join('');
    debt+=sub.length-p.length; out+=sub;
  }
  return out;
}
function chordsOf(text){
  const seq=[];
  for(const line of text.split('\n')){
    if(lineKind(line)!=='c') continue;
    for(const t of line.split(/[\s\-–—,|]+/)){ if(t&&isChordTok(t)&&!JUNK_RE.test(t)){const c=parseChord(t); if(c) seq.push(c)} }
  }
  return seq;
}

/* ---------- genres ---------- */
const GENRE={
  'Pasodoble':{bpm:116,meter:'2/4'}, 'Vals':{bpm:150,meter:'3/4'}, 'Bolero':{bpm:84,meter:'4/4'},

};
const GENRES=Object.keys(GENRE).filter(Boolean);

/* ---------- state ---------- */
const S={db:null,user:null,assets:null,me:null,canWrite:null,meta:{},filter:'',genre:'',song:null,tab:'letra',transpose:0,size:16,unsubs:[],live:{rev:[],tabs:[],videos:[],audios:[]},names:{},instr:'bandurria',editing:false};

async function names(ids){
  ids=[...new Set(ids.filter(Boolean))]; if(!S.user||!ids.length) return;

}
const who=id=>S.names[id]||'Un tuno';

/* ---------- routing ---------- */
function route(){
  stopAudio();stopScroll();
  const h=location.hash.slice(1);
  if(h.startsWith('s-')&&BYID[h.slice(2)]) openSong(h.slice(2)); else {closeSong(); renderList()}

addEventListener('hashchange',route);

/* ---------- list ---------- */
function renderList(){
  const app=$('#app');
  const q=norm(S.filter);
  const items=SONGS.filter(s=>(!S.genre||(S.genre==='__none'?!genreOf(s.id):genreOf(s.id)===S.genre))&&(!q||norm(s.title).includes(q)||norm(s.text).includes(q)));
  const gcount={}; SONGS.forEach(s=>{const g=genreOf(s.id)||'Sin ritmo';gcount[g]=(gcount[g]||0)+1});
  let html=`<div class="hero"><img src="${$('.crest').src}" alt=""><div><h1>Cancionero de la Tuna</h1><p>Universidad de Talca · ${SONGS.length} canciones</p></div></div><div class="tools"><input class="search" id="q" type="search" placeholder="Buscar canción o verso…" value="${esc(S.filter)}" aria-label="Buscar"></div>
  <div class="chips" role="group" aria-label="Ritmo"><button class="chip" data-g="" aria-pressed="${!S.genre}">Todas · ${SONGS.length}</button>${
    Object.entries(gcount).sort((a,b)=>b[1]-a[1]).map(([g,n])=>`<button class="chip" data-g="${esc(g==='Sin ritmo'?'__none':g)}" aria-pressed="${S.genre===(g==='Sin ritmo'?'__none':g)}">${esc(g)} · ${n}</button>`).join('')}</div>
  <p class="count">${items.length} ${items.length===1?'canción':'canciones'}${q?` con “${esc(S.filter)}”`:''}. <span class="dot" style="display:inline-block"></span> = tiene correcciones del grupo.</p><ul class="songs">`;
  let last='';
  for(const s of items){
    const L=norm(s.title)[0].toUpperCase();
    if(L!==last&&!q){html+=`<li class="letter">${esc(L)}</li>`;last=L}
    const m=metaOf(s.id);
    html+=`<li><a href="#s-${s.id}"><span class="t">${esc(s.title)}</span>${m.lastEditAt?'<span class="dot" title="Con correcciones"></span>':''}<span class="g">${esc(genreOf(s.id)||'')}${m.tempo?` · ${m.tempo}`:''}</span></a></li>`;
  }
  html+='</ul>';
  if(!items.length) html+=`<p class="empty">No hay canciones que coincidan. Prueba con otra palabra o quita el filtro de ritmo.</p>`;
  app.innerHTML=html;
  const qi=$('#q'); qi.oninput=()=>{S.filter=qi.value;const pos=qi.selectionStart;renderList();const n=$('#q');n.focus();n.setSelectionRange(pos,pos)};
  app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{S.genre=b.dataset.g;renderList()});
}

/* ---------- song ---------- */
function closeSong(){S.unsubs.forEach(u=>{try{u()}catch(e){}});S.unsubs=[];S.song=null;S.live={rev:[],tabs:[],videos:[],audios:[]};S.editing=false}
function openSong(id){
  if(S.song!==id){closeSong();S.song=id;S.transpose=0;S.tab='letra';subscribeSong(id)}
  renderSong();
}
function subscribeSong(id){
  if(!S.db) return;
  const sub=(col,key,order)=>{
    try{
      let q=S.db.collection(`songs/${id}/${col}`).orderBy(order||'at','desc').limit(200);
      const u=q.onSnapshot(snap=>{S.live[key]=snap.docs.map(d=>({id:d.id,...d.data()}));names(S.live[key].map(x=>x.by)).then(()=>{if(S.song===id&&!S.editing&&!busy())renderSong(true)})},e=>console.warn(col,e.code));
      S.unsubs.push(u);
    }catch(e){console.warn(e)}
  };
  sub('rev','rev');sub('tabs','tabs');sub('videos','videos');sub('audios','audios');
}

/* ---------- audio engine ---------- */
let AC=null; const BUF=new Map();
function ctx(){if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)()}return AC}
const mtof=m=>440*Math.pow(2,(m-69)/12);
function ksBuffer(midi,kind){
  const key=midi+kind; if(BUF.has(key)) return BUF.get(key);
  const ac=ctx(), sr=ac.sampleRate, f=mtof(midi);
  const dur={guitarra:1.8,bandurria:.5,laud:1.2,bajo:1.6}[kind]||1.2;
  const decay={guitarra:.996,bandurria:.990,laud:.994,bajo:.997}[kind]||.995;
  const bright={guitarra:.5,bandurria:.9,laud:.7,bajo:.15}[kind]||.5;
  const n=Math.floor(sr*dur), N=Math.max(2,Math.round(sr/f));
  const b=ac.createBuffer(1,n,sr), d=b.getChannelData(0);
  let prev=0; for(let i=0;i<N;i++){const r=Math.random()*2-1; prev=bright*r+(1-bright)*prev; d[i]=prev}
  for(let i=N;i<n;i++){d[i]=decay*0.5*(d[i-N]+(i-N-1>=0?d[i-N-1]:0))}
  let mx=0; for(let i=0;i<n;i++) mx=Math.max(mx,Math.abs(d[i])); if(mx) for(let i=0;i<n;i++) d[i]/=mx;
  BUF.set(key,b); return b;
}

  if(!Number.isFinite(midi)) return;
  const ac=ctx(), src=ac.createBufferSource(); src.buffer=ksBuffer(midi,kind);
  if(kind==='bandurria'||kind==='laud') src.detune.value=(Math.random()*6-3);
  const g=ac.createGain(); g.gain.setValueAtTime(gain,t); if(len){g.gain.setTargetAtTime(0,t+len,0.04)}
  src.connect(g).connect(PLAY.out); src.start(t); src.stop(t+(len?len+.3:2));
}
function drum(kind,t,vel){
  const ac=ctx();

    const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(70,t+.12);
    g.gain.setValueAtTime(.5*vel,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(g).connect(PLAY.out);o.start(t);o.stop(t+.22);
  }
  const s=ac.createBufferSource();s.buffer=noiseBuf();const hp=ac.createBiquadFilter();hp.type='highpass';hp.frequency.value=kind==='parche'?2500:6000;
  const g2=ac.createGain();g2.gain.setValueAtTime((kind==='parche'?.12:.22)*vel,t);g2.gain.exponentialRampToValueAtTime(.001,t+(kind==='parche'?.1:.16));
  s.connect(hp).connect(g2).connect(PLAY.out);s.start(t);s.stop(t+.2);

const PAT={

  '6/8':{steps:12,bass:[[0,'r'],[6,'f']],gtr:[[0,1],[4,.7],[6,1],[8,.7]],laud:[0,2,4,6,8,10],parche:[0,6],sonaja:[2,4,8,10]},
  'Cha cha chá':{steps:16,bass:[[0,'r'],[6,'f'],[8,'r']],gtr:[[4,1],[8,.8],[12,1],[14,.8]],laud:[0,4,8,12],parche:[12,14],sonaja:[0,4,8,10,12]},
  'Cumbia':{steps:16,bass:[[0,'r'],[8,'f']],gtr:[[4,1],[12,1]],laud:[0,4,8,12],parche:[0,8],sonaja:[2,6,10,14]},
  'Bolero':{steps:16,bass:[[0,'r'],[8,'f']],gtr:[[0,1],[6,.7],[8,1],[12,.7],[14,.6]],laud:[0,4,8,12],parche:[0,8],sonaja:[4,6,12,14]},
};
const PLAY={on:false,idx:0,step:0,next:0,timer:null,out:null,seq:[],inst:{guitarra:true,bandurria:true,laud:true,bajo:true,pandero:true},loop:true,bpm:100,pat:null};
function voice(c){
  const base=40+((c.root-4+12)%12); const tones=c.iv.map(i=>i%12);
  const g=[base, base+(tones.includes(7)?7:tones.includes(6)?6:tones.includes(8)?8:7), base+12, base+12+(c.iv[1]), base+12+(c.iv[2]??7), base+24];
  if(c.iv.length>3) g[5]=base+12+c.iv[3];

}
function chordMidis(c,low,high){const out=[];for(let m=low;m<=high;m++){if(c.iv.some(i=>(c.root+i)%12===m%12))out.push(m)}return out}
function schedStep(t){
  const c=PLAY.seq[PLAY.idx]; if(!c) return;

  if(PLAY.inst.bajo){for(const [s,w] of P.bass) if(s===st){const b=28+((c.bass-4+12)%12); playNote(w==='f'?b+7:b,'bajo',t,.9,beat*3.5)}}

  }
}

    ${a.kind==='file'?`<audio controls preload="none" src="/_blob/${esc(a.assetId)}"></audio>`:`<a href="${esc(a.url)}" target="_blank" rel="noopener">Abrir grabación ↗</a>`}</div>
    ${canW()&&(a.by===S.me||S.isAdmin)?`<button class="btn small" data-del="${esc(a.id)}">Quitar</button>`:''}</li>`).join('')}</ul>`
    :`<p class="empty">Aún no hay grabaciones. Sube cómo suena tu instrumento en esta canción para que los novatos aprendan.</p>`;
  if(canW()) h+=`<form class="form" id="audform">
    <div class="field"><label for="atitle">Título</label><input id="atitle" placeholder="Ej.: Punteo del coro" maxlength="80"></div>
    <div class="field"><label for="ainst">Instrumento</label><select id="ainst">${['Toda la tuna','Guitarra','Bandurria','Laúd','Contrabajo','Pandereta','Voz'].map(x=>`<option>${x}</option>`).join('')}</select></div>
    ${S.assets?`<div class="field"><label for="afile">Archivo (.m4a, .mp4 o .webm, hasta 20 MB)</label><input id="afile" type="file" accept=".m4a,.mp4,.webm,audio/mp4,audio/x-m4a,video/mp4,audio/webm,video/webm"></div>`:''}
    <div class="field"><label for="aurl">${S.assets?'o link (Drive, YouTube, SoundCloud)':'Link a la grabación (Drive, YouTube, SoundCloud)'}</label><input id="aurl" type="url" placeholder="https://…"></div>
    <button class="btn primary" id="asave" type="submit">Agregar grabación</button></form>
    <p class="note">Las notas de voz de WhatsApp (.opus) y los .mp3 no se pueden subir directo: súbelos a Drive y pega el link.</p>`;
  box.innerHTML=h;
  box.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{const a=list.find(x=>x.id===b.dataset.del);if(!a)return;if(b.dataset.sure!=='1'){b.dataset.sure='1';b.textContent='¿Seguro? Quitar';return}
    try{await S.db.doc(`songs/${id}/audios/${a.id}`).delete(); if(a.assetId&&S.assets){try{await S.assets.delete(a.assetId)}catch(e){}} toast('Grabación quitada')}catch(e){toast('No se pudo quitar')}});
  const f=$('#audform'); if(f) f.onsubmit=async e=>{
    e.preventDefault(); const btn=$('#asave'); const file=$('#afile')?.files?.[0]; const url=$('#aurl').value.trim();
    const base={title:$('#atitle').value.trim().slice(0,80),instrument:$('#ainst').value,by:S.me,at:Date.now()};
    btn.disabled=true;
    try{
      if(file){
        const ext=file.name.split('.').pop().toLowerCase();
        const type={m4a:'video/mp4',mp4:'video/mp4',webm:'video/webm'}[ext];
        if(!type){toast('Formato no soportado: usa .m4a, .mp4 o .webm, o pega un link');btn.disabled=false;return}
        if(file.size>20*1024*1024){toast('El archivo pesa más de 20 MB');btn.disabled=false;return}
        btn.textContent='Subiendo…';
        const r=await S.assets.upload(file,{type});
        await S.db.collection(`songs/${id}/audios`).add({...base,kind:'file',assetId:r.id});
      } else if(/^https?:\/\/\S+$/i.test(url)){
        await S.db.collection(`songs/${id}/audios`).add({...base,kind:'link',url});
      } else {toast('Elige un archivo o pega un link que empiece con https://');btn.disabled=false;return}
      toast('Grabación agregada');
    }catch(er){toast(er.code==='too_large'?'El archivo es muy pesado':er.code==='unsupported_type'?'Formato no soportado':'No se pudo agregar la grabación');btn.disabled=false;btn.textContent='Agregar grabación'}
  };
}

/* ---------- tablaturas ---------- */
const TUN={bandurria:{name:'Bandurria',open:[81,76,71,66,61,56]},laud:{name:'Laúd',open:[69,64,59,54,49,44]}};
const SNAME=['La','Mi','Si','Fa#','Do#','Sol#'];
function shapeFor(c,inst,prev){
  // voicing on courses 1-3 (index 0..2), frets 0..7
  const open=TUN[inst].open; let best=null;
  const pcs=c.iv.map(i=>(c.root+i)%12), third=(c.root+c.iv[1])%12;
  for(let a=0;a<=7;a++)for(let b=0;b<=7;b++)for(let d=0;d<=7;d++){
    const fr=[a,b,d], notes=fr.map((f,i)=>(open[i]+f)%12);
    if(!notes.every(n=>pcs.includes(n))) continue;
    if(!notes.includes(third)||!notes.includes(c.root)) continue;
    const used=fr.filter(f=>f>0), span=used.length?Math.max(...used)-Math.min(...used):0; if(span>3) continue;
    let cost=span*2+fr.reduce((x,y)=>x+y,0)*.4; if(prev) cost+=fr.reduce((x,f,i)=>x+Math.abs(f-prev[i]),0)*.5;
    if(!best||cost<best.cost) best={fr,cost};
  }
  return best?best.fr:null;
}
function suggestTab(seq,inst,meter){
  const per=meter==='3/4'?3:meter==='2/4'?4:meter==='6/8'?6:4; const order=per===3?[2,0,1]:per===6?[2,1,0,1,0,1]:[2,0,1,0];
  const shapes=[];let prev=null; for(const c of seq){const s=shapeFor(c,inst,prev);shapes.push(s);if(s)prev=s}
  const sys=[]; const W=3;
  for(let i=0;i<seq.length;i+=4){
    const chunk=seq.slice(i,i+4); const lines=Array.from({length:6},(_,k)=>SNAME[k].padEnd(4)+'|'); let head='    ';
    chunk.forEach((c,j)=>{const s=shapes[i+j]; head+=(' '+c.name).padEnd(per*W+1);
      for(let n=0;n<per;n++){const course=order[n]; for(let k=0;k<6;k++){lines[k]+=(s&&k===course?String(s[course]):'-').padEnd(W,'-')}}
      for(let k=0;k<6;k++) lines[k]+='|';});
    sys.push(head.trimEnd()+'\n'+lines.join('\n'));
  }
  return {text:sys.join('\n\n'),shapes};
}
function shapeSVG(c,fr){
  const w=64,h=78; let sv=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(c.name)}">`;
  const x0=8,y0=10,dx=(w-16)/5,dy=12; const base=fr?Math.max(1,Math.min(...fr.filter(f=>f>0).concat([99]))):1; const st=base>2?base:1;
  for(let i=0;i<6;i++) sv+=`<line x1="${x0+i*dx}" y1="${y0}" x2="${x0+i*dx}" y2="${y0+dy*5}" stroke="currentColor" stroke-opacity=".5" />`;
  for(let j=0;j<=5;j++) sv+=`<line x1="${x0}" y1="${y0+j*dy}" x2="${x0+dx*5}" y2="${y0+j*dy}" stroke="currentColor" stroke-opacity="${j===0&&st===1?1:.35}" stroke-width="${j===0&&st===1?2:1}" />`;
  if(fr) fr.forEach((f,ci)=>{const x=x0+(5-ci)*dx; if(f===0) sv+=`<circle cx="${x}" cy="${y0-5}" r="3" fill="none" stroke="currentColor"/>`; else sv+=`<circle cx="${x}" cy="${y0+(f-st+.5)*dy}" r="4.2" fill="currentColor"/>`});
  if(st>1) sv+=`<text x="${w-2}" y="${y0+8}" font-size="9" text-anchor="end" fill="currentColor">${st}</text>`;
  return sv+'</svg>';
}
function panelTab(){
  const id=S.song,p=$('#panel'),inst=S.instr, g=genreOf(id), meter=GENRE[g]?.meter||'4/4';
  const seq=chordsOf(songText(id)).map(c=>S.transpose?(parseChord(transposeTok(c.name,S.transpose))||c):c);
  const uniq=[];const seen=new Set(); for(const c of seq){if(!seen.has(c.name)){seen.add(c.name);uniq.push(c)}}
  const sug=suggestTab(seq,inst,meter);
  const saved=S.live.tabs.filter(t=>t.instrument===inst);
  const cur=saved[0];
  const shapes=uniq.map(c=>[c,shapeFor(c,inst,null)]);
  p.innerHTML=`${roNotice()}<div class="bar"><span class="grp"><span class="lbl">Instrumento</span><select id="instsel" aria-label="Instrumento">${Object.entries(TUN).map(([k,v])=>`<option value="${k}" ${k===inst?'selected':''}>${v.name}</option>`).join('')}</select></span>
  <span class="note">Afinación: Sol# · Do# · Fa# · Si · Mi · La (6.ª a 1.ª orden)${inst==='laud'?', una octava más grave que la bandurria':''}.</span></div>
  <h2 class="sec">Posiciones de los acordes</h2>
  <div class="shapes">${shapes.map(([c,fr])=>`<div class="shape">${shapeSVG(c,fr)}<b>${esc(c.name)}</b></div>`).join('')||'<p class="empty">Sin acordes.</p>'}</div>
  <p class="note">Tres órdenes agudas (La, Mi, Si). El círculo vacío es cuerda al aire; el número indica el traste de inicio.</p>
  <h2 class="sec">${cur?`Tablatura del grupo · ${esc(TUN[inst].name)}`:`Tablatura sugerida · ${esc(TUN[inst].name)}`}</h2>
  ${cur?`<p class="note">Versión de ${esc(who(cur.by))}, ${fmtDate(cur.at)}${cur.note?` — “${esc(cur.note)}”`:''}. ${saved.length>1?`${saved.length} versiones en total.`:''}</p>`:`<p class="note">Arpegio sugerido con las notas de cada acorde, ${meter}, un compás por acorde. Ajústalo con el punteo real y guárdalo para el grupo.</p>`}
  <div id="tabbox"></div>
  ${saved.length?`<h2 class="sec">Versiones anteriores</h2><ul class="list hist">${saved.map((t,i)=>`<li class="item"><div class="main"><b>${i===0?'Actual':'Versión '+(saved.length-i)}</b> · ${esc(who(t.by))} · ${fmtDate(t.at)}${t.note?`<div class="meta">${esc(t.note)}</div>`:''}</div>${i>0&&canW()?`<button class="btn small" data-restore="${esc(t.id)}">Restaurar</button>`:''}<button class="btn small" data-view="${esc(t.id)}">Ver</button></li>`).join('')}</ul>`:''}`;
  let viewing=cur?cur.text:sug.text;
  const showView=()=>{$('#tabbox').innerHTML=`<pre class="tabtext">${esc(viewing)}</pre><div class="bar" style="margin-top:10px">${canW()?`<button class="btn primary" id="tabedit">${cur?'Corregir tablatura':'Editar y guardar para el grupo'}</button>`:''}${cur?`<button class="btn" id="tabsug">Ver la sugerida</button>`:''}<button class="btn" id="tabcopy">Copiar</button></div>`;
    const te=$('#tabedit'); if(te) te.onclick=showEdit;
    const ts=$('#tabsug'); if(ts) ts.onclick=()=>{viewing=sug.text;showView()};
    $('#tabcopy').onclick=()=>{navigator.clipboard.writeText(viewing).then(()=>toast('Tablatura copiada'),()=>toast('Selecciona el texto y cópialo'))};
  };
  const showEdit=()=>{S.editing=true;$('#tabbox').innerHTML=`<textarea class="tabedit" id="tabta" spellcheck="false" wrap="off" aria-label="Tablatura">${esc(viewing)}</textarea>
    <div class="form" style="grid-template-columns:minmax(0,1fr) auto auto"><div class="field"><label for="tabnote">Qué cambiaste</label><input id="tabnote" placeholder="Ej.: punteo de la introducción en 5.º traste"></div><button class="btn" id="tabcancel">Cancelar</button><button class="btn primary" id="tabsave">Guardar versión</button></div>`;
    $('#tabcancel').onclick=()=>{S.editing=false;panelTab()};
    $('#tabsave').onclick=async()=>{const t=$('#tabta').value.replace(/\s+$/,'');if(!t){toast('La tablatura está vacía');return}$('#tabsave').disabled=true;
      try{await S.db.collection(`songs/${id}/tabs`).add({instrument:inst,text:t,note:$('#tabnote').value.trim().slice(0,300),by:S.me,at:Date.now()});await touchMeta(id,{});S.editing=false;toast('Tablatura guardada');panelTab()}catch(e){$('#tabsave').disabled=false;toast('No se pudo guardar')}};
  };
  showView();
  $('#instsel').onchange=e=>{S.instr=e.target.value;panelTab()};
  p.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{viewing=saved.find(t=>t.id===b.dataset.view).text;showView();$('#tabbox').scrollIntoView({behavior:'smooth',block:'start'})});
  p.querySelectorAll('[data-restore]').forEach(b=>b.onclick=async()=>{const t=saved.find(x=>x.id===b.dataset.restore);try{await S.db.collection(`songs/${id}/tabs`).add({instrument:inst,text:t.text,note:'Restaurada desde una versión anterior',by:S.me,at:Date.now()});toast('Versión restaurada')}catch(e){toast('No se pudo restaurar')}});
}

/* ---------- videos ---------- */
function panelVideos(){
  const id=S.song,p=$('#panel'),list=S.live.videos.slice().sort((a,b)=>(b.year||0)-(a.year||0)||b.at-a.at);
  const host=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return''}};
  p.innerHTML=`${roNotice()}<p class="note">Videos de la Tuna de la Universidad de Talca o de la Tuna Novata tocando esta canción.</p>
  ${list.length?`<ul class="list">${list.map(v=>`<li class="item"><div class="main"><a href="${esc(v.url)}" target="_blank" rel="noopener"><b>${esc(v.title||'Presentación')}</b> ↗</a>
   <div class="meta"><span class="pill ${v.group==='Tuna Novata UTAL'?'':'wine'}">${esc(v.group)}</span> ${v.year?esc(v.year):''}${v.place?' · '+esc(v.place):''} · ${esc(host(v.url))}</div>
   <div class="meta">Subido por ${esc(who(v.by))}</div></div>${canW()&&(v.by===S.me||S.isAdmin)?`<button class="btn small" data-del="${esc(v.id)}">Quitar</button>`:''}</li>`).join('')}</ul>`
   :'<p class="empty">Todavía no hay presentaciones. Agrega el link de un video donde la tuna haya tocado esta canción.</p>'}
  ${canW()?`<form class="form" id="vform">
    <div class="field" style="grid-column:1/-1"><label for="vurl">Link del video</label><input id="vurl" type="url" required placeholder="https://www.youtube.com/watch?v=…"></div>
    <div class="field"><label for="vtitle">Título</label><input id="vtitle" maxlength="100" placeholder="Ej.: Serenata Plaza de Armas"></div>
    <div class="field"><label for="vgroup">Tuna</label><select id="vgroup"><option>Tuna UTAL</option><option>Tuna Novata UTAL</option></select></div>
    <div class="field"><label for="vyear">Año</label><input id="vyear" type="number" min="1980" max="2100" placeholder="2025"></div>
    <div class="field"><label for="vplace">Lugar</label><input id="vplace" maxlength="80" placeholder="Ej.: Certamen de Tunas, Talca"></div>
    <button class="btn primary" type="submit">Agregar presentación</button></form>`:''}`;
  const f=$('#vform'); if(f) f.onsubmit=async e=>{e.preventDefault();const url=$('#vurl').value.trim();if(!/^https?:\/\/\S+$/i.test(url)){toast('El link debe empezar con https://');return}
    try{await S.db.collection(`songs/${id}/videos`).add({url,title:$('#vtitle').value.trim().slice(0,100),group:$('#vgroup').value,year:+$('#vyear').value||null,place:$('#vplace').value.trim().slice(0,80),by:S.me,at:Date.now()});toast('Presentación agregada')}catch(er){toast('No se pudo agregar')}};
  p.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(b.dataset.sure!=='1'){b.dataset.sure='1';b.textContent='¿Seguro? Quitar';return}try{await S.db.doc(`songs/${id}/videos/${b.dataset.del}`).delete();toast('Presentación quitada')}catch(e){toast('No se pudo quitar')}});
}

/* ---------- historial ---------- */
function panelHist(){
  const id=S.song,p=$('#panel'),revs=S.live.rev;
  const ev=[...revs.map(r=>({t:'Letra/acordes',x:r})),...S.live.tabs.map(r=>({t:'Tablatura '+(TUN[r.instrument]?.name||''),x:r})),...S.live.videos.map(r=>({t:'Presentación',x:r})),...S.live.audios.map(r=>({t:'Grabación',x:r}))].sort((a,b)=>b.x.at-a.x.at);
  p.innerHTML=`${roNotice()}${ev.length?`<ul class="list">${ev.map(e=>`<li class="item"><div class="main"><b>${esc(e.t)}</b> · ${esc(who(e.x.by))} · ${fmtDate(e.x.at)}${e.x.note?`<div class="meta">${esc(e.x.note)}</div>`:''}</div>${e.t==='Letra/acordes'&&canW()&&e.x!==revs[0]?`<button class="btn small" data-r="${esc(e.x.id)}">Restaurar esta letra</button>`:''}</li>`).join('')}</ul>
  ${revs.length&&canW()?'<p class="note" style="margin-top:12px">¿Quieres volver al texto original del Word? <button class="btn small" id="orig">Restaurar original</button></p>':''}`
  :'<p class="empty">Nadie ha corregido esta canción todavía. El texto viene del cancionero del 15-08-2026.</p>'}`;
  p.querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{const r=revs.find(x=>x.id===b.dataset.r);try{await S.db.collection(`songs/${id}/rev`).add({text:r.text,note:'Restaurada desde una versión anterior',by:S.me,at:Date.now()});toast('Versión restaurada')}catch(e){toast('No se pudo restaurar')}});
  const o=$('#orig'); if(o) o.onclick=async()=>{try{await S.db.collection(`songs/${id}/rev`).add({text:BYID[id].text,note:'Vuelta al original del Word',by:S.me,at:Date.now()});toast('Original restaurado')}catch(e){toast('No se pudo restaurar')}};
}

/* ---------- boot ---------- */
const use=n=>(window.claude&&window.claude.use)?window.claude.use(n):Promise.resolve(null);
function busy(){const p=$('#panel');if(!p)return false;if(p.contains(document.activeElement)&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return true;return [...p.querySelectorAll('form input:not([type=file]),form textarea')].some(i=>i.value&&i.type!=='number'&&i.id!=='bpm')||[...p.querySelectorAll('input[type=file]')].some(i=>i.files&&i.files.length)}
route();
(async()=>{
  const st=$('#status');
  const timer=setTimeout(()=>{},0);
  try{
    const [db,user,assets]=await Promise.all([use('db'),use('user'),use('assets').catch(()=>null)]);
    S.db=db;S.user=user;S.assets=assets;
    if(user){S.me=await user.id();S.canWrite=await user.can('data.write');S.isAdmin=await user.canEdit();if(S.canWrite===null)S.canWrite=S.me?true:false}
    if(!db){st.textContent='Versión sin conexión';return}
    const me=user?await user.me():null;
    db.collection('meta').onSnapshot(snap=>{clearTimeout(timer);S.meta=Object.fromEntries(snap.docs.map(d=>[d.id,d.data()]));
      st.textContent=(S.canWrite?'Puedes corregir':'Solo lectura')+(me&&me.name?' · '+me.name:'');
      if(!S.song){ if(!(document.activeElement&&document.activeElement.id==='q')) renderList(); } else if(!S.editing&&!PLAY.on&&!busy()) renderSong(true)},
      e=>{st.textContent='Sin conexión con las correcciones'});
    if(S.song) {subscribeSong(S.song)}
  }catch(e){st.textContent='Versión sin conexión'}
})();
